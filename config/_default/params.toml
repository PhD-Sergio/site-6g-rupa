# -- Site parameters --
# Read by the templates in layouts/. Language-specific text (brand name,
# description, contact details) lives in languages.en.toml.

# Default image for link previews (Open Graph / social cards), relative to assets/.
# A page can override it with `image` in its front matter.
ogImage = "img/og.png"

# Per-site Plausible >= 3.1 script: tracking options live in Plausible's
# Site Settings -> Site installation.
[plausibleAnalytics]
  domain = "6grupa.com"
  script = "https://plausible.sergiogimenez.com/js/pa-vBZ3rp81OJbEMrQ5ePVzX.js"
