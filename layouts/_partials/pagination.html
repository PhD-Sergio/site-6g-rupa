{{- if gt .TotalPages 1 }}
<nav class="pagination" aria-label="Pages">
  {{- with .Prev }}
  <a href="{{ .URL }}" rel="prev">Newer entries</a>
  {{- end }}
  <span>Page {{ .PageNumber }} of {{ .TotalPages }}</span>
  {{- with .Next }}
  <a href="{{ .URL }}" rel="next">Older entries</a>
  {{- end }}
</nav>
{{- end }}
