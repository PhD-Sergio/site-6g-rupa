# Papers, preprints, posters and talks.
#
# Shown on /research/ (via the {{< publications >}} shortcode, filtered by
# `kind`) and on the home page (papers and preprints). Entries appear in the
# order written here, so keep each kind newest first.
#
# kind: paper, preprint, poster or talk. `label` is the text shown for it.
# `venue` accepts Markdown (e.g. *Journal name* for italics).
# `url` is where clicking the title or the picture takes the reader.
# `image` (under assets/) is the picture; `visual` sets how it is drawn:
#   page (a page on a stack of pages), poster (a single sheet), figure, or
#   video (with `youtube`, the video id, and `duration`).
# Zenodo links use the concept DOI, which always resolves to the latest version.

